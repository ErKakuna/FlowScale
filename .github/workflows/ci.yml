# Continuous integration: builds FlowScale on GitHub's Windows runners and
# publishes a ready-to-run zip as an artifact of every push/PR.
#
# Get your exe: Actions tab -> latest "CI" run -> Artifacts -> FlowScale-win64.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_neural:
        description: "Also build the ONNX Runtime neural variant"
        type: boolean
        # Off by default: github.com/microsoft/onnxruntime (source of the
        # prebuilt zip) has been unreachable since 2026-11-17.
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (standard)
    uses: ./.github/workflows/build-windows.yml
    with:
      neural: false
      artifact_name: FlowScale-win64

  windows-neural:
    name: Windows x64 (ONNX neural)
    # Manual dispatch only (checkbox): the ONNX Runtime download is currently
    # unavailable, so it must not turn every push red.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_neural }}
    uses: ./.github/workflows/build-windows.yml
    with:
      neural: true
      artifact_name: FlowScale-win64-neural

  linux-tests:
    name: Linux (portable math tests + Windows-TU syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (tests only, no Windows/graphics deps)
        run: cmake -S . -B build-tests -DFLOWSCALE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-tests --parallel

      - name: Unit tests (pacing / optical-flow / sampler math)
        run: ctest --test-dir build-tests --output-on-failure

      # Catches missing includes / wrong arities / bad COM usage in the Windows
      # target on the fast Linux runner, before the Windows jobs waste minutes.
      - name: Windows-TU syntax check (stub SDK)
        run: bash scripts/syntax-check.sh
